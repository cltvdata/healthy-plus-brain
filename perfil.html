<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Healthy + Brain - Perfil</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-background-dark text-white min-h-screen">
    <div
        class="relative w-full max-w-md mx-auto min-h-screen flex flex-col overflow-x-hidden pb-24 animate-fade-in shadow-2xl bg-background-dark border-x border-white/5">

        <!-- Header Profile -->
        <header class="pt-12 pb-6 px-6 relative bg-gradient-to-b from-primary/10 to-transparent">
            <div class="flex items-center gap-4">
                <div
                    class="w-20 h-20 rounded-full border-2 border-primary bg-surface-dark flex items-center justify-center overflow-hidden shrink-0 shadow-[0_0_15px_rgba(19,236,91,0.2)]">
                    <span class="material-symbols-outlined text-[40px] text-gray-400">person</span>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-white leading-tight">Hola, Usuario</h1>
                    <p class="text-xs text-gray-400 mt-1">Miembro Premium desde 2026</p>
                </div>
            </div>

            <!-- Subscription Badge -->
            <div
                class="mt-6 bg-surface-dark rounded-2xl p-4 flex items-center gap-4 border border-white/5 relative overflow-hidden">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-primary/20 blur-2xl rounded-full"></div>
                <div class="w-12 h-12 rounded-xl bg-black overflow-hidden relative shrink-0">
                    <img src="assets/images/cover.png" class="w-full h-full object-cover opacity-70">
                </div>
                <div>
                    <h3 class="text-sm font-bold text-white mb-0.5">Premium Anual</h3>
                    <p class="text-xs text-primary font-medium flex items-center gap-1">
                        <span class="material-symbols-outlined text-[14px]">check_circle</span> Activa
                    </p>
                </div>
            </div>
        </header>

        <main class="flex-1 px-6 py-2 overflow-y-auto no-scrollbar">

            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-4">Ajustes Generales</h3>

            <div class="bg-surface-dark rounded-3xl border border-white/5 overflow-hidden mb-6">
                <!-- Settings Item -->
                <button
                    class="w-full flex items-center justify-between p-4 border-b border-white/5 hover:bg-white/5 transition-colors text-left group">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center group-hover:bg-primary/20 transition-colors">
                            <span
                                class="material-symbols-outlined text-[18px] text-gray-300 group-hover:text-primary transition-colors">notifications</span>
                        </div>
                        <span class="text-sm font-medium text-white">Notificaciones</span>
                    </div>
                    <span class="material-symbols-outlined text-gray-500">chevron_right</span>
                </button>

                <!-- Settings Item -->
                <button
                    class="w-full flex items-center justify-between p-4 border-b border-white/5 hover:bg-white/5 transition-colors text-left group">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center group-hover:bg-primary/20 transition-colors">
                            <span
                                class="material-symbols-outlined text-[18px] text-gray-300 group-hover:text-primary transition-colors">lock</span>
                        </div>
                        <span class="text-sm font-medium text-white">Privacidad y Seguridad</span>
                    </div>
                    <span class="material-symbols-outlined text-gray-500">chevron_right</span>
                </button>

                <!-- Settings Item -->
                <button
                    class="w-full flex items-center justify-between p-4 hover:bg-white/5 transition-colors text-left group">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center group-hover:bg-primary/20 transition-colors">
                            <span
                                class="material-symbols-outlined text-[18px] text-gray-300 group-hover:text-primary transition-colors">credit_card</span>
                        </div>
                        <span class="text-sm font-medium text-white">Métodos de Pago</span>
                    </div>
                    <span class="material-symbols-outlined text-gray-500">chevron_right</span>
                </button>
            </div>

    <button id="logout-btn"
        class="w-full flex items-center justify-center gap-2 text-red-500 font-bold text-sm h-14 rounded-2xl border border-red-500/20 hover:bg-red-500/10 transition-colors">
        <span class="material-symbols-outlined text-[18px]">logout</span> Cerrar Sesión
    </button>

        </main>

        <!-- Fixed Bottom Nav -->
        <nav
            class="fixed bottom-0 left-0 w-full border-t border-white/10 bg-background-dark/95 backdrop-blur-md pb-safe pt-3 z-50">
            <div class="flex items-center justify-around max-w-md mx-auto px-4 pb-4">
                <a href="index.html"
                    class="flex flex-col items-center gap-1 text-gray-500 hover:text-white transition-colors">
                    <span class="material-symbols-outlined">home</span>
                    <span class="text-[10px] font-medium">Inicio</span>
                </a>
                <a href="explorar.html"
                    class="flex flex-col items-center gap-1 text-gray-500 hover:text-white transition-colors">
                    <span class="material-symbols-outlined">explore</span>
                    <span class="text-[10px] font-medium">Explorar</span>
                </a>
                <a href="perfil.html" class="flex flex-col items-center gap-1 text-primary">
                    <span class="material-symbols-outlined filled"
                        style="font-variation-settings: 'FILL' 1;">person</span>
                    <span class="text-[10px] font-medium">Perfil</span>
                </a>
            </div>
        </nav>
    </div>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/firebase-config.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn && window.hb_auth) {
                logoutBtn.addEventListener('click', async () => {
                    try {
                        await window.hb_auth.signOut();
                        window.location.href = 'login.html';
                    } catch (error) {
                        console.error('Logout error:', error);
                    }
                });
            }
        });
    </script>
</body>

</html>
