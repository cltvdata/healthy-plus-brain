<!DOCTYPE html>
<html>
<head>
    <title>Clean DB</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="js/firebase-config.js"></script>
</head>
<body>
    <h1>Limpiando Usuarios de Prueba...</h1>
    <p id="status">Iniciando...</p>
    <script>
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        async function run() {
            try {
                await auth.signInAnonymously();
                document.getElementById('status').innerText = 'Autenticado. Buscando usuarios...';
                
                const snapshot = await db.collection('users').get();
                if(snapshot.empty) {
                    document.getElementById('status').innerText = 'No hay usuarios que eliminar. Limpio.';
                    return;
                }
                
                let b = db.batch();
                let count = 0;
                
                snapshot.forEach(doc => {
                    b.delete(doc.ref);
                    count++;
                    // Firestore batches max 500, we assume tests are < 500
                });
                
                await b.commit();
                document.getElementById('status').innerText = `¡Éxito! Base de datos limpia. Eliminados ${count} usuarios de prueba. Puedes cerrar esta página.`;
                console.log("Limpieza exitosa.");
            } catch(e) {
                document.getElementById('status').innerText = 'Error: ' + e.message;
                console.error(e);
            }
        }
        
        run();
    </script>
</body>
</html>
