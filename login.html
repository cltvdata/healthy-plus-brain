<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HEALTHY + BRAIN - Iniciar Sesión</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .glow-input:focus { box-shadow: 0 0 0 2px rgba(255,138,0,0.3), 0 0 20px rgba(255,138,0,0.1); }
        .pulse-glow { animation: pulse-glow 2s infinite; }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(19,236,91,0.3); }
            50% { box-shadow: 0 0 40px rgba(19,236,91,0.6); }
        }
    </style>
</head>
<body class="bg-dark text-white min-h-screen flex items-center justify-center p-4">
    <!-- Background effects -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-80 h-80 bg-primary/5 blur-3xl rounded-full"></div>
        <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-neon/5 blur-3xl rounded-full"></div>
    </div>

    <div class="w-full max-w-sm relative z-10">
        <!-- Logo -->
        <div class="text-center mb-10">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-primary to-neon flex items-center justify-center mx-auto mb-4 shadow-2xl shadow-primary/20">
                <span class="text-2xl font-black">H+B</span>
            </div>
            <h1 class="text-2xl font-black uppercase tracking-tight">HEALTHY + BRAIN</h1>
            <p class="text-sm text-white/40 mt-1">Soberanía Biológica</p>
        </div>

        <!-- Tab Switcher -->
        <div class="flex bg-white/5 rounded-xl p-1 mb-8">
            <button id="tab-login" class="flex-1 py-2.5 text-sm font-bold rounded-lg bg-primary text-dark transition-all">Iniciar Sesión</button>
            <button id="tab-register" class="flex-1 py-2.5 text-sm font-medium text-white/60 rounded-lg hover:text-white transition-all">Crear Cuenta</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4">
            <div>
                <label class="text-xs font-medium text-white/60 uppercase tracking-wider mb-2 block">Email</label>
                <input id="login-email" type="email" required
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3.5 text-sm text-white placeholder-white/30 outline-none glow-input focus:border-primary/50 transition-all"
                    placeholder="tu@email.com">
            </div>
            <div>
                <label class="text-xs font-medium text-white/60 uppercase tracking-wider mb-2 block">Contraseña</label>
                <input id="login-password" type="password" required
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3.5 text-sm text-white placeholder-white/30 outline-none glow-input focus:border-primary/50 transition-all"
                    placeholder="••••••••">
            </div>
            <button type="submit" id="login-submit"
                class="w-full py-4 bg-primary text-dark font-black uppercase tracking-wider rounded-xl hover:bg-primary/90 transition-all shadow-xl shadow-primary/20 active:scale-[0.98]">
                <span id="login-text">ACCEDER</span>
                <span id="login-spinner" class="hidden inline-flex items-center gap-2">PROCESANDO <div class="w-4 h-4 border-2 border-dark/30 border-t-dark rounded-full animate-spin"></div></span>
            </button>
            <p id="login-error" class="text-red-500 text-xs text-center hidden"></p>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="space-y-4 hidden">
            <div>
                <label class="text-xs font-medium text-white/60 uppercase tracking-wider mb-2 block">Email</label>
                <input id="reg-email" type="email" required
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3.5 text-sm text-white placeholder-white/30 outline-none glow-input focus:border-primary/50 transition-all"
                    placeholder="tu@email.com">
            </div>
            <div>
                <label class="text-xs font-medium text-white/60 uppercase tracking-wider mb-2 block">Contraseña</label>
                <input id="reg-password" type="password" required minlength="6"
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3.5 text-sm text-white placeholder-white/30 outline-none glow-input focus:border-primary/50 transition-all"
                    placeholder="Mín. 6 caracteres">
            </div>
            <div>
                <label class="text-xs font-medium text-white/60 uppercase tracking-wider mb-2 block">Confirmar Contraseña</label>
                <input id="reg-confirm" type="password" required
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3.5 text-sm text-white placeholder-white/30 outline-none glow-input focus:border-primary/50 transition-all"
                    placeholder="Repite la contraseña">
            </div>
            <button type="submit" id="register-submit"
                class="w-full py-4 bg-bio text-dark font-black uppercase tracking-wider rounded-xl hover:bg-bio/90 transition-all shadow-xl shadow-bio/20 active:scale-[0.98] pulse-glow">
                <span id="reg-text">CREAR CUENTA</span>
                <span id="reg-spinner" class="hidden inline-flex items-center gap-2">PROCESANDO <div class="w-4 h-4 border-2 border-dark/30 border-t-dark rounded-full animate-spin"></div></span>
            </button>
            <p id="reg-success" class="text-bio text-xs text-center hidden">Cuenta creada! Revisa tu email para verificar.</p>
            <p id="reg-error" class="text-red-500 text-xs text-center hidden"></p>
        </form>

        <!-- Divider -->
        <div class="flex items-center gap-4 my-6">
            <div class="flex-1 h-px bg-white/10"></div>
            <span class="text-xs text-white/30">O CONTINÚA CON</span>
            <div class="flex-1 h-px bg-white/10"></div>
        </div>

        <!-- Google Sign In -->
        <button id="google-btn"
            class="w-full flex items-center justify-center gap-3 py-3.5 bg-white/5 border border-white/10 rounded-xl hover:bg-white/10 transition-all text-sm font-medium">
            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            <span id="google-text">Google</span>
        </button>
        <p id="google-error" class="text-red-500 text-xs text-center mt-2 hidden"></p>

        <p class="text-xs text-white/30 text-center mt-8">
            Al continuar, aceptas nuestros 
            <a href="terms.html" class="text-primary hover:underline">Términos</a> y 
            <a href="privacy-policy.html" class="text-primary hover:underline">Privacidad</a>
        </p>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const auth = window.hb_auth;
            const db = window.hb_db;

            // Auto-redirect if already logged in
            if (auth?.currentUser) {
                window.location.href = 'index.html';
                return;
            }

            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const loginError = document.getElementById('login-error');
            const regError = document.getElementById('reg-error');
            const regSuccess = document.getElementById('reg-success');
            const googleError = document.getElementById('google-error');

            // Tab switching
            tabLogin.addEventListener('click', () => {
                tabLogin.className = 'flex-1 py-2.5 text-sm font-bold rounded-lg bg-primary text-dark transition-all';
                tabRegister.className = 'flex-1 py-2.5 text-sm font-medium text-white/60 rounded-lg hover:text-white transition-all';
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginError.classList.add('hidden');
                regError.classList.add('hidden');
                regSuccess.classList.add('hidden');
            });

            tabRegister.addEventListener('click', () => {
                tabRegister.className = 'flex-1 py-2.5 text-sm font-bold rounded-lg bg-bio text-dark transition-all';
                tabLogin.className = 'flex-1 py-2.5 text-sm font-medium text-white/60 rounded-lg hover:text-white transition-all';
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                loginError.classList.add('hidden');
                regError.classList.add('hidden');
                regSuccess.classList.add('hidden');
            });

            // Login
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;
                const submitBtn = document.getElementById('login-submit');
                const text = document.getElementById('login-text');
                const spinner = document.getElementById('login-spinner');

                submitBtn.disabled = true;
                text.classList.add('hidden');
                spinner.classList.remove('hidden');
                loginError.classList.add('hidden');

                try {
                    await auth.signInWithEmailAndPassword(email, password);
                    window.location.href = 'index.html';
                } catch (error) {
                    loginError.textContent = error.code === 'auth/user-not-found' ? 'No hay cuenta con este email' :
                        error.code === 'auth/wrong-password' ? 'Contraseña incorrecta' :
                        error.code === 'auth/invalid-email' ? 'Email inválido' :
                        error.code === 'auth/too-many-requests' ? 'Demasiados intentos. Espera un momento' :
                        'Error al iniciar sesión: ' + error.message;
                    loginError.classList.remove('hidden');
                    submitBtn.disabled = false;
                    text.classList.remove('hidden');
                    spinner.classList.add('hidden');
                }
            });

            // Register
            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('reg-email').value;
                const password = document.getElementById('reg-password').value;
                const confirm = document.getElementById('reg-confirm').value;
                const submitBtn = document.getElementById('register-submit');
                const text = document.getElementById('reg-text');
                const spinner = document.getElementById('reg-spinner');

                if (password !== confirm) {
                    regError.textContent = 'Las contraseñas no coinciden';
                    regError.classList.remove('hidden');
                    return;
                }

                if (password.length < 6) {
                    regError.textContent = 'La contraseña debe tener al menos 6 caracteres';
                    regError.classList.remove('hidden');
                    return;
                }

                submitBtn.disabled = true;
                text.classList.add('hidden');
                spinner.classList.remove('hidden');
                regError.classList.add('hidden');
                regSuccess.classList.add('hidden');

                try {
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    const user = userCredential.user;

                    // Create user doc in Firestore
                    await db.collection('users').doc(user.uid).set({
                        email: email,
                        ntkBalance: 500,
                        bioScore: 85,
                        hrv: 60,
                        trialEndDate: new Date(Date.now() + 15 * 24 * 60 * 60 * 1000).toISOString(),
                        subscriptionStatus: 'trial',
                        profileCompleted: false,
                        createdAt: new Date().toISOString()
                    });

                    // Send verification email
                    if (window.hb_secure_auth) {
                        await window.hb_secure_auth.signUpWithVerification(email, password);
                    }

                    regSuccess.textContent = 'Cuenta creada! Revisa tu email para verificar.';
                    regSuccess.classList.remove('hidden');
                    submitBtn.disabled = false;
                    text.classList.remove('hidden');
                    spinner.classList.add('hidden');

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 3000);
                } catch (error) {
                    regError.textContent = error.code === 'auth/email-already-in-use' ? 'Este email ya está registrado' :
                        error.code === 'auth/weak-password' ? 'Contraseña muy débil (mín. 6 caracteres)' :
                        error.code === 'auth/invalid-email' ? 'Email inválido' :
                        'Error al crear cuenta: ' + error.message;
                    regError.classList.remove('hidden');
                    submitBtn.disabled = false;
                    text.classList.remove('hidden');
                    spinner.classList.add('hidden');
                }
            });

            // Google Sign In (redirect-based)
            document.getElementById('google-btn').addEventListener('click', async () => {
                googleError.classList.add('hidden');
                document.getElementById('google-text').textContent = 'Conectando...';
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    await auth.signInWithPopup(provider);
                    window.location.href = 'index.html';
                } catch (error) {
                    googleError.textContent = error.code === 'auth/popup-closed-by-user' ?
                        'Ventana cerrada. Intenta de nuevo.' : 'Error con Google: ' + error.message;
                    googleError.classList.remove('hidden');
                    document.getElementById('google-text').textContent = 'Google';
                }
            });
        });
    </script>
</body>
</html>
