<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Soberanía - HEALTHY + BRAIN</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="js/firebase-config.js"></script>
</head>
<body class="bg-[#0a0a0a] text-white font-['Outfit'] min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-white/[0.03] backdrop-blur-xl border border-white/10 p-10 rounded-[32px] text-center shadow-2xl relative overflow-hidden">
        <!-- Glow background -->
        <div class="absolute -right-20 -top-20 w-48 h-48 bg-primary/10 blur-3xl rounded-full"></div>
        
        <div class="relative z-10">
            <div class="w-20 h-20 rounded-2xl bg-primary/10 flex items-center justify-center mx-auto mb-8 border border-primary/20">
                <span id="status-icon" class="material-symbols-outlined text-primary text-4xl font-black animate-pulse">mark_email_read</span>
            </div>

            <h1 id="status-title" class="text-2xl font-black uppercase italic tracking-tighter mb-4">Verificando Soberanía...</h1>
            <p id="status-body" class="text-sm text-white/60 leading-relaxed mb-10">Estamos validando tu firma digital en el Bio-Cloud para asegurar la integridad de tus datos.</p>

            <button id="cta-btn" onclick="window.location.href='index.html'" class="hidden w-full py-4 bg-primary text-black font-black uppercase tracking-widest rounded-2xl shadow-xl shadow-primary/20 hover:scale-105 active:scale-95 transition-all">
                ACCEDER AL LOBBY
            </button>
            
            <div id="loading-spinner" class="flex justify-center">
                <div class="w-8 h-8 border-4 border-primary/20 border-t-primary rounded-full animate-spin"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const auth = window.hb_auth;
            const urlParams = new URLSearchParams(window.location.search);
            const oobCode = urlParams.get('oobCode');

            if (oobCode) {
                try {
                    await auth.applyActionCode(oobCode);
                    
                    document.getElementById('status-icon').innerText = 'verified_user';
                    document.getElementById('status-icon').classList.remove('animate-pulse');
                    document.getElementById('status-title').innerText = 'Bio-ID Activado';
                    document.getElementById('status-body').innerText = 'Tu soberanía ha sido confirmada. Ahora puedes acceder a todos los protocolos premium de Healthy + Brain.';
                    document.getElementById('cta-btn').classList.remove('hidden');
                    document.getElementById('loading-spinner').classList.add('hidden');
                } catch (error) {
                    console.error("Verification Error:", error);
                    document.getElementById('status-icon').innerText = 'error';
                    document.getElementById('status-icon').classList.remove('text-primary');
                    document.getElementById('status-icon').classList.add('text-red-500');
                    document.getElementById('status-title').innerText = 'Enlace Inválido';
                    document.getElementById('status-body').innerText = 'El link ha expirado o ya ha sido utilizado. Por favor, solicita uno nuevo desde el setup.';
                    document.getElementById('loading-spinner').classList.add('hidden');
                }
            } else {
                document.getElementById('status-title').innerText = 'Esperando Enlace...';
                document.getElementById('status-body').innerText = 'Por favor, utiliza el link que enviamos a tu correo para verificar tu cuenta.';
                document.getElementById('loading-spinner').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
